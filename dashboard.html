<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard | FloMind</title>
  <meta name="application-name" content="FloMind" />
  <meta name="apple-mobile-web-app-title" content="FloMind" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="dashboard-page-shell">
    <a class="dashboard-close-link overlay-icon-close" href="index.html" aria-label="Torna alla home">×</a>

    <header class="page-header dashboard-page-header">
      <div class="dashboard-page-heading">
        <h1 id="titolo-dashboard" class="page-title">Dashboard</h1>
        <p class="page-subtitle">I task salvati, pronti da controllare.</p>
      </div>
    </header>

    <section class="sezione dashboard-controls-card" aria-label="Filtri dashboard">
      <details class="dashboard-filters-panel">
        <summary class="dashboard-filters-summary">
          <div>
            <h2>Filtri</h2>
          </div>
          <span class="dashboard-filters-summary-indicator" aria-hidden="true">Apri</span>
        </summary>

        <div class="filtri-dashboard dashboard-filters-grid">
          <div class="filtro-gruppo dashboard-filter-group">
            <span class="filtro-label">Priorita</span>
            <div class="filtro-opzioni" id="filtro-priorita">
              <button type="button" class="filtro-btn attivo" data-valore="tutte">Tutte</button>
              <button type="button" class="filtro-btn" data-valore="alta">Alta</button>
              <button type="button" class="filtro-btn" data-valore="media">Media</button>
              <button type="button" class="filtro-btn" data-valore="bassa">Bassa</button>
            </div>
          </div>

          <div class="filtro-gruppo dashboard-filter-group">
            <span class="filtro-label">Stato</span>
            <div class="filtro-opzioni" id="filtro-stato">
              <button type="button" class="filtro-btn attivo" data-valore="tutte">Tutte</button>
              <button type="button" class="filtro-btn" data-valore="non-completate">Attive</button>
              <button type="button" class="filtro-btn" data-valore="completate">Completate</button>
            </div>
          </div>

          <div class="filtro-gruppo dashboard-filter-group dashboard-filter-toggle-group">
            <span class="filtro-label">Scadenza</span>
            <label class="filtro-toggle-label dashboard-filter-toggle">
              <input type="checkbox" id="filtro-scadenza" />
              <span>Solo con scadenza</span>
            </label>
          </div>

        </div>
      </details>
    </section>

    <main class="dashboard-layout">
      <section class="sezione dashboard-main-card" id="box-dashboard-azioni" aria-labelledby="dashboard-task-heading">
        <div class="dashboard-section-header">
          <div>
            <h2 id="dashboard-task-heading">Tutti i task</h2>
          </div>
        </div>

        <div id="contenitore-dashboard-azioni" class="dashboard-task-list"></div>
        <p id="dashboard-azioni-vuote" class="sottotitolo dashboard-empty-state nascosto">Nessun task salvato</p>
      </section>
    </main>

    <div class="dashboard-bottom-actions">
      <button type="button" id="bottone-svuota-dashboard">Svuota tutti i task</button>
    </div>

  </div>

  <script src="authClient.js"></script>
  <script src="dashboard.js"></script>

</body>
</html>
