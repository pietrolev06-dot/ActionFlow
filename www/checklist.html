<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checklist | FloMind</title>
  <meta name="application-name" content="FloMind" />
  <meta name="apple-mobile-web-app-title" content="FloMind" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container container-checklist">
    <h1>Checklist</h1>
    <p class="sottotitolo">Task estratti dalle azioni pulite di FloMind.</p>

    <div class="toolbar-checklist">
      <button type="button" class="button-secondario" onclick="window.location.href='index.html'">Torna a FloMind</button>
      <button type="button" id="bottone-svuota-checklist">
        <span class="ui-button-content">
          <span class="ui-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <path d="M9.25 4.5a1 1 0 0 1 .95-.68h3.6a1 1 0 0 1 .95.68l.25.75H18.5a.75.75 0 0 1 0 1.5h-.64l-.72 11.03A2.25 2.25 0 0 1 14.89 20H9.11a2.25 2.25 0 0 1-2.25-2.22L6.14 6.75H5.5a.75.75 0 0 1 0-1.5H9l.25-.75Zm-1 2.25.71 10.93a.75.75 0 0 0 .75.72h5.78a.75.75 0 0 0 .75-.72l.71-10.93h-8.7Zm2.49 2.25a.75.75 0 0 1 .75.75v5.5a.75.75 0 0 1-1.5 0v-5.5a.75.75 0 0 1 .75-.75Zm3.5 0a.75.75 0 0 1 .75.75v5.5a.75.75 0 0 1-1.5 0v-5.5a.75.75 0 0 1 .75-.75Z" fill="currentColor"></path>
            </svg>
          </span>
          <span>Svuota checklist</span>
        </span>
      </button>
    </div>

    <div class="sezione blu" id="box-checklist-pagina">
      <h2>Task</h2>
      <ul id="lista-checklist"></ul>
      <p id="checklist-vuota" class="sottotitolo nascosto">Nessuna azione disponibile. Torna alla home e analizza un testo.</p>
    </div>
  </div>

  <script src="authClient.js"></script>
  <script src="checklist.js"></script>
</body>
</html>
