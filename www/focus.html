<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Focus | FloMind</title>
  <meta name="application-name" content="FloMind" />
  <meta name="apple-mobile-web-app-title" content="FloMind" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container focus-page-shell">
    <header class="page-header">
      <div>
        <p class="page-kicker">FloMind</p>
        <h1 class="page-title">Adesso</h1>
        <p id="focus-sommario" class="page-subtitle focus-page-subtitle">Solo quello che conta adesso.</p>
      </div>
      <a class="page-back-link" href="index.html">Torna alla home</a>
    </header>

    <section id="sezione-focus" class="focus-section focus-page-section nascosto">
      <div class="focus-now-shell">
        <div id="focus-blocco-ora" class="focus-blocco focus-blocco-ora nascosto">
          <h3>Adesso</h3>
          <ul id="focus-lista-ora"></ul>
        </div>
      </div>

      <section class="focus-next-shell" aria-labelledby="focus-next-title">
        <div class="focus-next-header">
          <h2 id="focus-next-title">Prossimi task</h2>
        </div>

        <div class="focus-next-list">
          <div id="focus-blocco-dopo" class="focus-blocco focus-blocco-dopo nascosto">
            <h3>Subito dopo</h3>
            <ul id="focus-lista-dopo"></ul>
          </div>

          <div id="focus-blocco-piu-tardi" class="focus-blocco focus-blocco-piu-tardi nascosto">
            <h3>Più tardi</h3>
            <ul id="focus-lista-piu-tardi"></ul>
          </div>

          <div id="focus-blocco-extra" class="focus-blocco focus-blocco-extra nascosto">
            <h3>Se avanza tempo</h3>
            <ul id="focus-lista-extra"></ul>
          </div>
        </div>
      </section>
    </section>

    <section id="focus-empty-state" class="sezione focus-empty-state nascosto">
      <h2>Nessun task per oggi</h2>
      <p class="page-subtitle">Vuoi iniziare da domani?</p>
      <button id="btn-focus-start-tomorrow" class="home-primary-action" type="button">Inizia da domani</button>
    </section>
  </div>

  <script src="authClient.js"></script>
  <script src="habits.js"></script>
  <script src="script.js"></script>
</body>
</html>
