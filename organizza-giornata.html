<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Organizza giornata | ActionFlow</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container daily-plan-page-shell">
    <header class="page-header daily-plan-page-header">
      <div>
        <p class="page-kicker">ActionFlow</p>
        <h1 class="page-title">Organizza giornata</h1>
        <p id="piano-giornaliero-sommario" class="page-subtitle daily-plan-page-subtitle">Distribuisci i task della giornata in uno spazio più pulito e focalizzato.</p>
      </div>

      <div class="daily-plan-page-actions">
        <button id="btn-rigenera-piano" class="home-secondary-action daily-plan-refresh-button" type="button">Rigenera piano</button>
        <a class="page-back-link" href="/">Torna alla home</a>
      </div>
    </header>

    <section id="sezione-piano-giornaliero" class="sezione blu sezione-piano-giornaliero daily-plan-page-section">
      <p id="piano-giornaliero-vuoto" class="piano-giornaliero-vuoto nascosto">Nessun task attivo disponibile per organizzare la giornata.</p>

      <div id="piano-giornaliero-grid" class="piano-giornaliero-grid">
        <div id="blocco-mattina" class="piano-blocco piano-blocco-mattina nascosto">
          <h3>Mattina</h3>
          <ul id="lista-mattina"></ul>
        </div>

        <div id="blocco-pomeriggio" class="piano-blocco piano-blocco-pomeriggio nascosto">
          <h3>Pomeriggio</h3>
          <ul id="lista-pomeriggio"></ul>
        </div>

        <div id="blocco-resta-da-fare-oggi" class="piano-blocco piano-blocco-resta-oggi nascosto">
          <h3>Resta da fare oggi</h3>
          <ul id="lista-resta-da-fare-oggi"></ul>
        </div>

        <div id="blocco-se-avanza-tempo" class="piano-blocco piano-blocco-extra nascosto">
          <h3>Se avanza tempo</h3>
          <ul id="lista-se-avanza-tempo"></ul>
        </div>
      </div>
    </section>
  </div>

  <script src="authClient.js"></script>
  <script src="script.js"></script>
</body>
</html>
